<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Página no encontrada · Pablo Meyer</title>
<meta name="description" content="La página que buscas no existe. Vuelve al portfolio de Pablo Meyer.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#111110">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@200;300;400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<style>
  /* Mismo lenguaje editorial que el resto del sitio: sin degradados ni halos */
  body {
    background: var(--black); color: var(--white);
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; justify-content: center;
    padding: 96px 24px 32px;
  }
  .wrap { width: 100%; max-width: var(--container); margin: 0 auto; flex: 1; display: flex; flex-direction: column; justify-content: center; }

  .eyebrow-404 { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.45); margin-bottom: 28px; }

  /* El 404 en contorno: el mismo recurso que el "& UX/UI" de la home */
  .big-num {
    font-size: clamp(120px, 26vw, 300px); font-weight: 900;
    line-height: 0.78; letter-spacing: -0.06em; margin-bottom: 40px;
    color: rgba(255,255,255,0.25);
  }
  @supports (-webkit-text-stroke: 1px #fff) {
    .big-num { -webkit-text-fill-color: transparent; -webkit-text-stroke: clamp(2px, 0.3vw, 4px) var(--white); }
  }

  .title { font-size: clamp(26px, 3.6vw, 44px); font-weight: 900; letter-spacing: -0.032em; line-height: 1.05; margin-bottom: 18px; }
  .desc { font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.55); margin-bottom: 40px; max-width: 480px; }
  .actions { display: flex; gap: 14px; flex-wrap: wrap; }

  .btn-primary:hover { background: var(--white); }
  .btn-secondary { color: var(--white); border-color: rgba(255,255,255,0.25); }
  .btn-secondary:hover { background: var(--white); color: var(--black); border-color: var(--white); }

  .footer-mini {
    max-width: var(--container); margin: 0 auto; width: 100%;
    border-top: 1px solid var(--rule-dark); padding-top: 20px; margin-top: 56px;
    font-size: 12px; color: rgba(255,255,255,0.35);
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .footer-mini a { color: rgba(255,255,255,0.55); text-decoration: none; transition: color var(--dur-fast); }
  .footer-mini a:hover { color: var(--accent); }

  @media (max-width: 540px) {
    body { padding: 80px 20px 24px; }
    .actions { flex-direction: column; align-items: stretch; }
    .actions a { justify-content: center; }
  }
</style>
</head>
<body>

<main class="wrap">
  <p class="eyebrow-404">Error 404</p>
  <h1 class="big-num">404</h1>
  <p class="title">Esta página no existe.</p>
  <p class="desc">O la URL está mal escrita, o la página se mudó. Lo que sí sigue ahí es el portfolio entero — vuelve al inicio o escríbeme directamente.</p>
  <div class="actions">
    <a href="/" class="btn-primary">← Volver al inicio</a>
    <a href="/index.html#hablemos" class="btn-secondary">Escribirme</a>
  </div>
</main>

<div class="footer-mini">
  <span>© <span id="copy-year">2026</span> · Pablo Meyer</span>
  <a href="mailto:pablo.meyer00@gmail.com">pablo.meyer00@gmail.com</a>
</div>

<script>
  const yearEl = document.getElementById('copy-year');
  if (yearEl) yearEl.textContent = new Date().getFullYear();
</script>

</body>
</html>
